<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polylogue · 工作台</title>
<style>
  :root {
    --bg: #0d0f13;
    --panel: #151821;
    --panel2: #1b1f2a;
    --line: #262c3a;
    --text: #e6e8ee;
    --muted: #8892a6;
    --accent: #6ea8fe;
    --danger: #ff6b6b;
    --ok: #4ade80;
    --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 48px 1fr;
    grid-template-areas: "head head head" "side main insp";
    overflow: hidden;
  }
  header {
    grid-area: head;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .brand { font-weight: 700; letter-spacing: .4px; }
  header .brand span { color: var(--accent); }
  header .roomname { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    background: var(--accent); color: #07121f; border: 0; border-radius: 7px;
    padding: 7px 13px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }
  button.danger { background: var(--danger); color: #2a0b0b; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------------- 左栏 */
  aside {
    grid-area: side; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head {
    padding: 12px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #rooms { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .room {
    padding: 9px 10px; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .room:hover { background: var(--panel2); }
  .room.active { background: var(--panel2); border-color: var(--accent); }
  .room .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .meta { font-size: 11px; color: var(--muted); }
  .room .del {
    opacity: 0; font-size: 15px; color: var(--muted); padding: 0 3px;
  }
  .room:hover .del { opacity: 1; }
  .room .del:hover { color: var(--danger); }

  /* ---------------- 中栏 */
  main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 12px; font-weight: 700; letter-spacing: .3px; margin-bottom: 2px; }
  .msg.user { border-left-color: #46506a; }
  .msg.user .who { color: #9aa4b8; }
  .msg.err { border-left-color: var(--danger); }
  .msg.err .body { color: var(--danger); }
  .msg.pending .body { color: var(--muted); font-style: italic; }
  .mention { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; line-height: 2; }
  .empty code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; }

  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 170px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  /* ---------------- 右栏 */
  .insp {
    grid-area: insp; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 12px; min-height: 0;
  }
  .insp h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: var(--muted); margin: 16px 0 8px; font-weight: 600;
  }
  .insp h3:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv .k { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 0; border-bottom: 1px solid var(--line); }
  td { padding: 5px 0; border-bottom: 1px solid #1c212c; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; }
  .note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .note.warn { color: var(--warn); }

  /* ---------------- 新建房间 */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modal.open { display: flex; }
  .dialog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; width: 440px; max-height: 80vh; overflow-y: auto;
  }
  .dialog h2 { margin: 0 0 14px; font-size: 15px; }
  .dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  .dialog input[type=text], .dialog input[type=number] {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 8px 10px; font: inherit; outline: none;
  }
  .dialog input:focus { border-color: var(--accent); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
  .pick label {
    display: flex; align-items: center; gap: 7px; margin: 0; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    font-size: 13px; color: var(--text);
  }
  .pick label:hover { border-color: var(--accent); }
  .pick label.off { opacity: .35; cursor: not-allowed; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<header>
  <div class="brand">poly<span>logue</span></div>
  <div class="roomname" id="hdrRoom"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnExport">导出</button>
  <button class="danger" id="btnStop" disabled>停止</button>
</header>

<aside>
  <div class="side-head">
    <span>房间</span>
    <button class="ghost" id="btnNew" style="padding:2px 8px">＋</button>
  </div>
  <div id="rooms"></div>
</aside>

<main>
  <div id="log"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <div class="row">
      <textarea id="input" placeholder="说点什么。不 @ 任何人 = 同时问所有成员；@名字 只说给某个人听。"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</main>

<div class="insp">
  <h3>花费</h3>
  <div class="kv"><span class="k">tokens</span><span id="stTokens">0</span></div>
  <div class="kv"><span class="k">估算成本</span><span id="stCost">$0.0000</span></div>
  <div class="kv"><span class="k">轮次上限</span><span id="stRounds">-</span></div>
  <h3>每个模型</h3>
  <table>
    <thead><tr><th>模型</th><th class="num">tokens</th><th class="num">花费</th></tr></thead>
    <tbody id="stBody"><tr><td colspan="3" style="color:var(--muted)">还没有发言</td></tr></tbody>
  </table>
  <h3>说明</h3>
  <div class="note" id="stNote"></div>
</div>

<div id="modal">
  <div class="dialog">
    <h2>新建房间</h2>
    <label>房间名</label>
    <input type="text" id="mName" placeholder="比如：并发方案评审">
    <label>成员（只列出已配置 key 的）</label>
    <div class="pick" id="mPick"></div>
    <div class="row2">
      <div><label>轮次上限</label><input type="number" id="mRounds" value="6" min="1"></div>
      <div><label>成本上限（美元，留空不限）</label><input type="number" id="mCost" step="0.01" placeholder="不限"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="mCancel">取消</button>
      <button id="mCreate">创建</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = { providers: [], rooms: [], current: null, running: false, priceTable: '' };

function hue(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function colorFor(n) { return `hsl(${hue(n)}, 62%, 68%)`; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n) { return n === null || n === undefined ? '?' : n.toLocaleString(); }
function money(c) { return c === null || c === undefined ? '未知' : '$' + c.toFixed(4); }

async function api(path, opts) {
  const res = await fetch(path, opts);
  const ct = res.headers.get('Content-Type') || '';
  const data = ct.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

/* ---------------- 房间列表 */
async function loadRooms() {
  const data = await api('/api/rooms');
  state.rooms = data.rooms;
  const box = $('rooms');
  box.innerHTML = '';
  for (const r of state.rooms) {
    const el = document.createElement('div');
    el.className = 'room' + (r.id === state.current ? ' active' : '');
    el.innerHTML = `<div class="nm">${esc(r.name)}</div>
      <div class="meta">${r.turns} 条</div>
      <span class="del" title="删除">×</span>`;
    el.onclick = e => {
      if (e.target.classList.contains('del')) { delRoom(r.id); return; }
      selectRoom(r.id);
    };
    box.appendChild(el);
  }
}

async function delRoom(id) {
  if (!confirm('删除这个房间？转录会一起没掉。')) return;
  await api('/api/rooms/' + id, { method: 'DELETE' });
  if (state.current === id) {
    state.current = null;
    $('log').innerHTML = '';
    $('hdrRoom').textContent = '';
  }
  await loadRooms();
  if (!state.current && state.rooms.length) selectRoom(state.rooms[0].id);
}

async function selectRoom(id) {
  state.current = id;
  const data = await api('/api/rooms/' + id);
  $('hdrRoom').textContent = data.name + ' · ' + data.members.join(' / ');
  renderChips(data.members);
  renderLog(data.turns);
  updateStats({
    total_tokens: data.tokens, total_cost: data.cost, cost_unknown: data.cost_unknown,
    by_model: null, budget: data.budget,
  });
  await loadRooms();
}

/* ---------------- 对话渲染 */
function renderChips(members) {
  const box = $('chips');
  box.innerHTML = '';
  for (const m of members) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = '@' + m;
    c.style.color = colorFor(m);
    c.onclick = () => {
      const inp = $('input');
      inp.value = (inp.value.replace(/\s*$/, '') + ' @' + m + ' ').trimStart();
      inp.focus();
    };
    box.appendChild(c);
  }
}

function msgEl(who, text, cls = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (who) {
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = who;
    w.style.color = who === 'user' ? '#9aa4b8' : colorFor(who);
    el.appendChild(w);
  }
  const b = document.createElement('div');
  b.className = 'body';
  b.innerHTML = esc(text).replace(/@([A-Za-z0-9_-]+)/g, '<span class="mention">@$1</span>');
  el.appendChild(b);
  return el;
}

function renderLog(turns) {
  const log = $('log');
  log.innerHTML = '';
  if (!turns || !turns.length) {
    log.innerHTML = `<div class="empty">这个房间还没有对话。<br>
      不 <code>@</code> 任何人 = 同时问所有成员；<br>
      <code>@名字</code> = 只说给某个人听。</div>`;
    return;
  }
  for (const t of turns) {
    log.appendChild(msgEl(t.speaker, t.error ? t.error : t.content, t.error ? 'err' : (t.role === 'user' ? 'user' : '')));
  }
  log.scrollTop = log.scrollHeight;
}

function appendMsg(who, text, cls) {
  const log = $('log');
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const el = msgEl(who, text, cls);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* ---------------- 统计 */
function updateStats(s) {
  $('stTokens').textContent = fmt(s.total_tokens);
  $('stCost').textContent = money(s.total_cost) + (s.cost_unknown ? '+' : '');
  if (s.budget) $('stRounds').textContent = s.budget.max_rounds;
  if (s.by_model) renderStatsTable(s.by_model);
  $('stNote').innerHTML = `价格表 ${esc(state.priceTable)}，是估算值，以各家官网为准。`
    + (s.cost_unknown ? '<br><span style="color:var(--warn)">有模型查不到价格，真实花费更高。</span>' : '');
}

function renderStatsTable(rows) {
  const body = $('stBody');
  if (!rows || !rows.length) {
    body.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">还没有发言</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r => `<tr>
      <td><span class="swatch" style="background:${colorFor(r.speaker)}"></span>${esc(r.speaker)}</td>
      <td class="num">${fmt(r.tokens)}</td>
      <td class="num">${r.unknown ? '未知' : money(r.cost)}</td>
    </tr>`).join('');
}

/* ---------------- 发言 */
async function say() {
  const text = $('input').value.trim();
  if (!text || state.running || !state.current) return;
  $('input').value = '';
  appendMsg('user', text, 'user');
  setRunning(true);
  const pending = appendMsg('…', '等待回应', 'pending');

  try {
    const res = await fetch(`/api/rooms/${state.current}/say`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ('HTTP ' + res.status));
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', first = true;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(chunk.slice(6)); } catch { continue; }

        if (ev.type === 'turn' || ev.type === 'error') {
          if (first) { pending.remove(); first = false; }
        }
        if (ev.type === 'turn') appendMsg(ev.speaker, ev.content);
        else if (ev.type === 'error') appendMsg(ev.speaker, ev.message, 'err');
        else if (ev.type === 'done') {
          if (first) { pending.remove(); first = false; }
          updateStats({
            total_tokens: ev.tokens, total_cost: ev.cost,
            cost_unknown: ev.cost_unknown, by_model: ev.stats, budget: null,
          });
          if (ev.stop) {
            const n = document.createElement('div');
            n.className = 'note';
            n.style.marginTop = '6px';
            n.textContent = '— ' + ev.stop;
            $('log').appendChild(n);
            $('log').scrollTop = $('log').scrollHeight;
          }
        }
      }
    }
  } catch (err) {
    pending.remove();
    appendMsg('system', '请求失败：' + err.message, 'err');
  } finally {
    setRunning(false);
    $('input').focus();
    loadRooms();
  }
}

function setRunning(on) {
  state.running = on;
  $('send').disabled = on;
  $('send').textContent = on ? '会商中…' : '发送';
  $('btnStop').disabled = !on;
  if (!on) $('btnStop').textContent = '停止';
}

async function stopRun() {
  if (!state.current) return;
  $('btnStop').disabled = true;
  $('btnStop').textContent = '停止中…';
  await api(`/api/rooms/${state.current}/stop`, { method: 'POST' });
}

/* ---------------- 新建房间 */
async function openModal() {
  const data = await api('/api/info');
  state.providers = data.providers;
  state.priceTable = data.price_table;
  const pick = $('mPick');
  pick.innerHTML = '';
  for (const p of state.providers) {
    const l = document.createElement('label');
    if (!p.available) l.className = 'off';
    l.innerHTML = `<input type="checkbox" value="${esc(p.name)}" ${p.available ? '' : 'disabled'}>
      ${esc(p.name)}<span style="color:var(--muted);font-size:11px">${esc(p.model)}</span>`;
    if (!p.available && p.env) l.title = '需要设置 ' + p.env;
    pick.appendChild(l);
  }
  $('modal').classList.add('open');
}

async function createRoom() {
  const picked = [...document.querySelectorAll('#mPick input:checked')].map(i => i.value);
  if (!picked.length) { alert('至少选一个模型'); return; }
  const cost = $('mCost').value.trim();
  try {
    const room = await api('/api/rooms', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: $('mName').value.trim() || '未命名房间',
        members: picked,
        max_rounds: parseInt($('mRounds').value) || 6,
        max_cost_usd: cost ? parseFloat(cost) : null,
      }),
    });
    $('modal').classList.remove('open');
    $('mName').value = '';
    await loadRooms();
    await selectRoom(room.id);
  } catch (err) {
    alert('创建失败：' + err.message);
  }
}

/* ---------------- 事件绑定 */
$('send').onclick = say;
$('btnStop').onclick = stopRun;
$('btnNew').onclick = openModal;
$('mCancel').onclick = () => $('modal').classList.remove('open');
$('mCreate').onclick = createRoom;
$('btnExport').onclick = () => {
  if (state.current) window.open(`/api/rooms/${state.current}/export`, '_blank');
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); say(); }
});
$('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') $('modal').classList.remove('open');
});

/* ---------------- 启动 */
(async () => {
  try {
    const info = await api('/api/info');
    state.priceTable = info.price_table;
    state.providers = info.providers;
    await loadRooms();
    if (state.rooms.length) await selectRoom(info.default_room || state.rooms[0].id);
    if (info.skipped && info.skipped.length) {
      $('stNote').innerHTML = '<span style="color:var(--warn)">启动时跳过的成员：</span><br>'
        + info.skipped.map(esc).join('<br>');
    }
  } catch (err) {
    $('log').innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
  }
  $('input').focus();
})();
</script>
</body>
</html>
