<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polylogue</title>
<style>
  :root[data-theme="dark"]{
    --bg:#0a0a0c; --panel:#111114; --panel2:#17171b; --panel3:#1e1e24;
    --line:#26262d; --line2:#33333c;
    --text:#f3f3f6; --muted:#8e8e9a; --dim:#5b5b66;
    --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14);
    --ok:#3ddc84; --warn:#ffb020; --danger:#ff5f5f;
    --bubble:#1b1b21; --bubble-me:#2b3f7a;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f6f6f8; --panel2:#efeff2; --panel3:#e8e8ec;
    --line:#e4e4e9; --line2:#d4d4db;
    --text:#141418; --muted:#66666f; --dim:#9b9ba5;
    --accent:#2f5fe0; --accent-soft:rgba(47,95,224,.10);
    --ok:#0f9d58; --warn:#c77700; --danger:#d93025;
    --bubble:#f2f2f5; --bubble-me:#2f5fe0;
    --shadow:0 8px 30px rgba(20,20,30,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.62 -apple-system,"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; grid-template-columns:264px 1fr; grid-template-rows:54px 1fr;
    grid-template-areas:"head head" "rail main";
  }
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .btn{background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font-weight:600;
    transition:filter .14s,transform .06s}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
  .btn.ghost{background:var(--panel2);color:var(--muted)}
  .btn.ghost:hover{color:var(--text)}
  .btn.danger{background:var(--danger);color:#fff}
  .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    color:var(--muted);transition:.14s;font-size:15px}
  .ico:hover{background:var(--panel2);color:var(--text)}
  input,textarea,select{font:inherit;background:var(--panel2);color:var(--text);
    border:1px solid transparent;border-radius:9px;padding:9px 12px;outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--bg)}
  ::placeholder{color:var(--dim)}

  /* ───────── header ───────── */
  header{grid-area:head;display:flex;align-items:center;gap:10px;padding:0 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;letter-spacing:.2px}
  .brand .dot{width:9px;height:9px;border-radius:3px;
    background:linear-gradient(135deg,var(--accent),#a855f7)}
  .brand span{color:var(--accent)}
  .searchwrap{flex:1;max-width:460px;position:relative;margin-left:18px}
  .searchwrap input{padding-left:34px;height:34px;border-radius:10px}
  .searchwrap .mag{position:absolute;left:11px;top:8px;color:var(--dim);font-size:13px}
  .grow{flex:1}
  .pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--panel2);
    color:var(--muted);white-space:nowrap}

  /* ───────── 左栏 ───────── */
  .rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;gap:4px;padding:10px 12px 4px}
  .tab{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:13px;
    color:var(--muted);font-weight:600;transition:.14s}
  .tab.on{background:var(--accent-soft);color:var(--accent)}
  .tab:hover:not(.on){background:var(--panel2);color:var(--text)}
  .railacts{display:flex;gap:6px;padding:6px 12px 8px}
  .railacts .btn{flex:1;font-size:12px;padding:7px 0}
  .scroll{flex:1;overflow-y:auto;padding:2px 8px 14px;min-height:0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .grp{margin-top:10px}
  .grph{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;
    letter-spacing:.7px;text-transform:uppercase;color:var(--dim);font-weight:650;cursor:pointer;
    border-radius:7px}
  .grph:hover{background:var(--panel2)}
  .grph .cv{font-size:9px;transition:transform .16s;display:inline-block}
  .grph.closed .cv{transform:rotate(-90deg)}
  .grph .n{margin-left:auto;font-weight:500;letter-spacing:0}
  .item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;
    cursor:pointer;position:relative;transition:background .12s}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--accent-soft)}
  .item.on .nm{color:var(--accent)}
  .av{width:32px;height:32px;border-radius:9px;flex:none;object-fit:cover;
    background:var(--panel3);display:grid;place-items:center;font-size:13px;font-weight:700;
    color:var(--muted);overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.stack{position:relative}
  .av.stack img{position:absolute;width:60%;height:60%;border-radius:6px;
    border:1.5px solid var(--panel)}
  .av.stack img:nth-child(1){left:0;top:0}
  .av.stack img:nth-child(2){right:0;top:0}
  .av.stack img:nth-child(3){left:20%;bottom:0}
  .meta{min-width:0;flex:1}
  .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:1px}
  .acts2{display:none;gap:2px}
  .item:hover .acts2{display:flex}
  .acts2 button{width:22px;height:22px;border-radius:6px;color:var(--dim);font-size:12px}
  .acts2 button:hover{background:var(--panel3);color:var(--text)}
  .badge{font-size:9.5px;padding:1px 5px;border-radius:5px;background:var(--panel3);
    color:var(--dim);font-weight:600;flex:none}
  .railempty{padding:22px 14px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.9}

  /* ───────── 主区 ───────── */
  .main{grid-area:main;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
  .mhead{display:flex;align-items:center;gap:10px;padding:11px 20px;
    border-bottom:1px solid var(--line);min-height:56px}
  .mhead .ttl{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;cursor:text;border-radius:6px;padding:2px 6px;margin-left:-6px}
  .mhead .ttl:hover{background:var(--panel2)}
  .mhead input.rename{max-width:280px;font-size:15px;font-weight:700;height:30px;padding:2px 8px}
  .mhead .mem{display:flex;gap:-6px;margin-left:2px}
  .mhead .mem img{width:24px;height:24px;border-radius:7px;border:2px solid var(--bg);
    margin-left:-6px;background:var(--panel3)}
  .mhead .mem img:first-child{margin-left:0}
  .mhead .sp{flex:1}
  .mhead .cost{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  #log{flex:1;overflow-y:auto;padding:22px 26px 10px;min-height:0}
  #log::-webkit-scrollbar{width:9px}
  #log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  .row{display:flex;gap:10px;margin-bottom:18px;animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.me{flex-direction:row-reverse}
  .row .av{width:34px;height:34px;border-radius:10px}
  .bub{max-width:min(680px,78%);background:var(--bubble);border-radius:14px;
    padding:10px 14px;word-break:break-word;white-space:pre-wrap}
  .row.me .bub{background:var(--bubble-me);color:#fff}
  .row.me .bub .mention{color:#cfe0ff}
  .who{font-size:11.5px;color:var(--muted);font-weight:650;margin-bottom:4px;
    display:flex;align-items:center;gap:6px}
  .who .tk{font-weight:400;color:var(--dim);font-size:10.5px}
  .row.err .bub{background:rgba(255,95,95,.12);color:var(--danger);border:1px solid rgba(255,95,95,.3)}
  .mention{color:var(--accent);font-weight:650}
  .note{justify-content:center;margin:6px 0 18px}
  .note .txt{font-size:12px;color:var(--dim);background:var(--panel2);padding:5px 12px;border-radius:99px}
  .bigempty{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:var(--dim);gap:14px;text-align:center;padding:40px}
  .bigempty .h{font-size:17px;color:var(--muted);font-weight:650}
  .bigempty kbd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:1px 7px;font-family:inherit;color:var(--accent);font-size:12.5px}
  .bigempty .cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .bigempty .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;cursor:pointer;transition:.15s;min-width:150px}
  .bigempty .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .bigempty .card b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
  .bigempty .card small{color:var(--dim);font-size:11.5px}

  .composer{border-top:1px solid var(--line);padding:12px 22px 16px;background:var(--bg)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px 3px 4px;
    border-radius:99px;background:var(--panel2);color:var(--muted);cursor:pointer;transition:.14s}
  .chip:hover{background:var(--accent-soft);color:var(--accent)}
  .chip img{width:16px;height:16px;border-radius:5px}
  .crow{display:flex;gap:10px;align-items:flex-end}
  textarea{resize:none;min-height:48px;max-height:200px;padding:13px 15px;border-radius:12px}
  .sendbtn{height:48px;padding:0 20px;border-radius:12px}

  /* ───────── 右栏 ───────── */
  .insp{width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);
    transition:width .18s;flex:none}
  .insp.open{width:250px}
  .inspin{width:250px;padding:16px;overflow-y:auto;height:100%}
  .insp h3{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
    margin:18px 0 8px;font-weight:650}
  .insp h3:first-child{margin-top:0}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
  .kv .k{color:var(--muted)}
  .kv .v{font-variant-numeric:tabular-nums;font-weight:600}
  .bar{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:8px 0 6px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#a855f7);
    transition:width .35s}
  .hint{font-size:11px;color:var(--dim);line-height:1.7}
  .memb{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12.5px}
  .memb img{width:22px;height:22px;border-radius:6px}
  .memb .c{margin-left:auto;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}

  /* ───────── 弹层 ───────── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
    z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(580px,100%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}
  .sheet .sh{padding:20px 24px 6px}
  .sheet h2{margin:0 0 4px;font-size:17px}
  .sheet .desc{color:var(--muted);font-size:12.5px;line-height:1.8}
  .sheet .sb{padding:10px 24px 4px}
  .sheet .sf{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:9px}
  .lbl{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:290px;overflow-y:auto;padding:2px}
  .pick .p{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;
    border:1.5px solid var(--line);cursor:pointer;transition:.13s}
  .pick .p:hover{border-color:var(--line2)}
  .pick .p.on{border-color:var(--accent);background:var(--accent-soft)}
  .pick .p img{width:28px;height:28px;border-radius:8px}
  .pick .p .nm{font-size:13px}
  .pick .p .sub{font-size:10.5px}
  .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:8px}
  /* 密钥输入：默认不显示，眼睛按钮才临时露出来 */
  .secretwrap{position:relative}
  .secretwrap input{padding-right:40px;letter-spacing:1.5px;font-family:ui-monospace,Consolas,monospace}
  .secretwrap input[type="password"]{letter-spacing:2.5px}
  .secretwrap .eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;font-size:13px;border-radius:7px}
  .secretwrap .eye.on{color:var(--warn)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer}
  .chk input{width:auto}

  /* 搜索结果 */
  .hits{padding:14px 22px;overflow-y:auto;flex:1}
  .hit{padding:11px 14px;border-radius:11px;cursor:pointer;border:1px solid transparent}
  .hit:hover{background:var(--panel2);border-color:var(--line)}
  .hit .t{font-size:13px;font-weight:650;margin-bottom:3px;display:flex;gap:8px;align-items:center}
  .hit .t .w{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--panel3);
    color:var(--dim);font-weight:600}
  .hit .s{font-size:12.5px;color:var(--muted);line-height:1.6}
  .hit mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
  .hithead{padding:4px 22px 10px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="brand"><i class="dot"></i>poly<span>logue</span></div>
  <div class="searchwrap">
    <span class="mag">⌕</span>
    <input id="q" placeholder="搜索对话和历史发言…" autocomplete="off">
  </div>
  <div class="grow"></div>
  <span class="pill" id="modePill"></span>
  <button class="ico" id="btnTheme" title="切换明暗">◐</button>
  <button class="ico" id="btnInsp" title="成员与花费">☰</button>
  <button class="ico" id="btnSet" title="设置">⚙</button>
</header>

<aside class="rail">
  <div class="tabs">
    <div class="tab on" data-tab="chats">会话</div>
    <div class="tab" data-tab="contacts">通讯录</div>
  </div>
  <div class="railacts">
    <button class="btn" id="btnNew">＋ 新对话</button>
  </div>
  <div class="scroll" id="list"></div>
</aside>

<main class="main">
  <div class="mhead">
    <div class="ttl" id="ttl">选一个对话</div>
    <div class="mem" id="memAv"></div>
    <div class="sp"></div>
    <div class="cost" id="costTop"></div>
    <button class="ico" id="btnExport" title="导出">⇩</button>
  </div>
  <div id="log"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <div class="crow">
      <textarea id="input" placeholder="说点什么…  不 @ 任何人 = 全员回答；@名字 = 只说给某个人听"></textarea>
      <button class="btn sendbtn" id="btnSend">发送</button>
      <button class="btn danger sendbtn" id="btnStop" style="display:none">停止</button>
    </div>
  </div>
  <div class="insp" id="insp">
    <div class="inspin">
      <h3>花费</h3>
      <div class="kv"><span class="k">tokens</span><span class="v" id="sTok">0</span></div>
      <div class="kv"><span class="k">估算成本</span><span class="v" id="sCost">$0.0000</span></div>
      <h3>上下文</h3>
      <div class="bar"><i id="cBar" style="width:0%"></i></div>
      <div class="kv"><span class="k" id="cLbl">还没开始</span><span class="v" id="cNum"></span></div>
      <div class="hint" id="cHint"></div>
      <h3>成员</h3>
      <div id="memList"><div class="hint">—</div></div>
      <h3>说明</h3>
      <div class="hint" id="noteBox"></div>
    </div>
  </div>
</main>

<!-- 新对话 -->
<div class="modal" id="mNew">
  <div class="sheet">
    <div class="sh">
      <h2>新对话</h2>
      <div class="desc">选一个模型是单聊，选多个就是群聊。</div>
    </div>
    <div class="sb">
      <label class="lbl">名字（可留空，自动取成员名）</label>
      <input id="nTitle" placeholder="比如：架构评审">
      <label class="lbl">分类</label>
      <input id="nCat" list="catList" placeholder="常用">
      <datalist id="catList"></datalist>
      <label class="lbl">选成员</label>
      <div class="pick" id="nPick"></div>
      <div class="err" id="nErr"></div>
    </div>
    <div class="sf">
      <button class="btn ghost" data-close="mNew">取消</button>
      <button class="btn" id="nGo">创建</button>
    </div>
  </div>
</div>

<!-- 新联系人 -->
<div class="modal" id="mContact">
  <div class="sheet">
    <div class="sh">
      <h2>添加模型</h2>
      <div class="desc">填 provider 和模型 id。用 OpenRouter 的话填 <code>vendor/model</code>。</div>
    </div>
    <div class="sb">
      <div class="row2">
        <div>
          <label class="lbl">名字</label>
          <input id="cName" placeholder="比如：Claude">
        </div>
        <div>
          <label class="lbl">分类</label>
          <input id="cCat" list="catList" placeholder="常用">
        </div>
      </div>
      <label class="lbl">provider</label>
      <select id="cProv"></select>
      <label class="lbl">模型 id</label>
      <input id="cModel" placeholder="anthropic/claude-haiku-4.5">
      <label class="lbl">角色（可选）</label>
      <select id="cRole">
        <option value="">无</option>
        <option value="critic">critic · 挑毛病</option>
        <option value="builder">builder · 出方案</option>
        <option value="explorer">explorer · 查漏</option>
        <option value="reviewer">reviewer · 复核</option>
      </select>
      <div class="err" id="cErr"></div>
    </div>
    <div class="sf">
      <button class="btn ghost" data-close="mContact">取消</button>
      <button class="btn" id="cGo">添加</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="mSet">
  <div class="sheet">
    <div class="sh"><h2>设置</h2><div class="desc">改了立即生效，存在本机。</div></div>
    <div class="sb">
      <label class="lbl">外观</label>
      <div class="row2">
        <button class="btn ghost" id="thDark">深色</button>
        <button class="btn ghost" id="thLight">浅色</button>
      </div>
      <label class="lbl">上下文压缩</label>
      <label class="chk"><input type="checkbox" id="setCompress"><span>开启（推荐，长对话省钱）</span></label>
      <div class="row2" style="margin-top:10px">
        <div>
          <label class="lbl" style="margin-top:0">逐字保留最近几条</label>
          <input type="number" id="setKeep" min="2" max="40" value="8">
        </div>
        <div>
          <label class="lbl" style="margin-top:0">上下文上限（token）</label>
          <input type="number" id="setBudget" min="500" step="500" value="6000">
        </div>
      </div>
      <div class="row2" style="margin-top:10px">
        <div>
          <label class="lbl" style="margin-top:0">单轮上限</label>
          <input type="number" id="setRounds" min="1" value="6">
        </div>
        <div>
          <label class="lbl" style="margin-top:0">成本上限（美元）</label>
          <input type="number" id="setCost" step="0.1" value="0.5">
        </div>
      </div>
      <div class="err" id="setErr"></div>
    </div>
    <div class="sf">
      <button class="btn ghost" data-close="mSet">取消</button>
      <button class="btn" id="setGo">保存</button>
    </div>
  </div>
</div>

<!-- 首次引导 -->
<div class="modal" id="mOnb">
  <div class="sheet">
    <div class="sh">
      <h2>先接上一个模型</h2>
      <div class="desc">填一次就够，之后不用再管。key 只存在本机
        <code>~/.polylogue/config.json</code>（权限已收紧到仅当前用户），不会上传。</div>
    </div>
    <div class="sb">
      <div id="onbFound"></div>
      <div class="row2">
        <div>
          <label class="lbl">provider</label>
          <select id="onbProv">
            <option value="openrouter">OpenRouter（一个 key 调所有厂商）</option>
            <option value="openai">OpenAI</option>
            <option value="claude">Claude</option>
            <option value="gemini">Gemini</option>
            <option value="deepseek">DeepSeek</option>
            <option value="grok">Grok</option>
          </select>
        </div>
        <div>
          <label class="lbl">API key</label>
          <div class="secretwrap">
            <input id="onbKey" type="password" placeholder="粘贴 key（默认不显示）"
                   autocomplete="new-password" autocapitalize="off" autocorrect="off"
                   spellcheck="false" data-lpignore="true" data-1p-ignore="true">
            <button class="ico eye" id="onbEye" type="button" title="显示 / 隐藏">◉</button>
          </div>
        </div>
      </div>
      <div class="hint" style="margin-top:8px">key 只走本机回环连接，不写日志、不进浏览器存储；
        提交后输入框立即清空。</div>
      <div class="err" id="onbErr"></div>
    </div>
    <div class="sf"><button class="btn" id="onbGo">开始</button></div>
  </div>
</div>

<script>
const $ = i => document.getElementById(i);
const S = {
  info:null, contacts:[], cats:[], convs:[], cur:null, conv:null,
  theme:"dark", tab:"chats", q:"", hits:null, running:false, closed:new Set()
};

/* ───────── 小工具 ───────── */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n==null? "?": Number(n).toLocaleString());
const money = c => c==null? "未知" : "$"+Number(c).toFixed(4);
const avUrl = key => "/api/avatar/" + encodeURIComponent(key||"generic");
const contactOf = id => S.contacts.find(c=>c.id===id);
const cname = id => (contactOf(id)||{}).name || id;

async function api(path, opt){
  const r = await fetch(path, opt);
  const ct = r.headers.get("Content-Type")||"";
  const d = ct.includes("json") ? await r.json() : await r.text();
  if(!r.ok) throw new Error((d&&d.error)||("HTTP "+r.status));
  return d;
}
const post = (p,b) => api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const patch = (p,b) => api(p,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const del = p => api(p,{method:"DELETE"});

/* ───────── 主题 ───────── */
function applyTheme(t){
  S.theme = t === "light" ? "light" : "dark";
  document.documentElement.dataset.theme = S.theme;
  $("btnTheme").textContent = S.theme === "dark" ? "◐" : "◑";
}
async function setTheme(t){
  applyTheme(t);
  try{ await post("/api/settings", {theme:S.theme}); }catch(e){}
}

/* ───────── 载入 ───────── */
async function refresh(info){
  S.info = info || await api("/api/info");
  S.contacts = S.info.contacts || [];
  S.cats = S.info.categories || [];
  S.convs = S.info.conversations || [];
  applyTheme(S.info.theme || "dark");

  $("modePill").textContent = S.info.origin || "";
  $("noteBox").innerHTML = "价格表 " + esc(S.info.price_table) + "，估算值，以各家官网为准。"
    + (S.info.skipped && S.info.skipped.length
        ? '<br><span style="color:var(--warn)">跳过：'+S.info.skipped.map(esc).join("；")+"</span>" : "");

  $("catList").innerHTML = S.cats.map(c=>`<option value="${esc(c)}">`).join("");
  const provSel = $("cProv");
  if(provSel.options.length === 0){
    provSel.innerHTML = (S.info.providers||[]).map(p=>
      `<option value="${esc(p.name)}"${p.name==="openrouter"?" selected":""}>${esc(p.name)}${p.available?"":"（没 key）"}</option>`
    ).join("");
  }

  if(S.info.onboarding){ showOnboarding(); }
  renderList();

  const pick = S.cur && S.convs.find(c=>c.id===S.cur) ? S.cur
             : (S.convs.length ? S.convs[0].id : null);
  if(pick) await openConv(pick, true);
  else renderEmpty();
}

/* ───────── 左栏 ───────── */
function renderList(){
  const box = $("list");
  box.innerHTML = "";
  if(S.tab === "chats") renderChats(box); else renderContacts(box);
}

function groupBy(items, keyFn){
  const m = new Map();
  for(const it of items){
    const k = keyFn(it) || "其他";
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  return m;
}

function renderChats(box){
  if(!S.convs.length){
    box.innerHTML = '<div class="railempty">还没有对话<br>点上面「＋ 新对话」</div>';
    return;
  }
  const order = [...S.cats, "其他"];
  const grouped = groupBy(S.convs, c=>c.category);
  const keys = [...grouped.keys()].sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });

  for(const cat of keys){
    const rows = grouped.get(cat);
    const closed = S.closed.has("c:"+cat);
    const g = document.createElement("div");
    g.className = "grp";
    g.innerHTML = `<div class="grph${closed?" closed":""}" data-g="c:${esc(cat)}">
        <span class="cv">▾</span>${esc(cat)}<span class="n">${rows.length}</span></div>`;
    g.querySelector(".grph").onclick = () => {
      const k = "c:"+cat;
      S.closed.has(k) ? S.closed.delete(k) : S.closed.add(k);
      renderList();
    };
    if(!closed) for(const c of rows) g.appendChild(convItem(c));
    box.appendChild(g);
  }
}

function convItem(c){
  const el = document.createElement("div");
  el.className = "item" + (c.id===S.cur ? " on" : "");
  const mems = (c.members||[]).slice(0,3);
  const av = mems.length > 1
    ? `<div class="av stack">${mems.map(id=>`<img src="${avUrl(id)}" alt="">`).join("")}</div>`
    : `<div class="av"><img src="${avUrl(mems[0]||"generic")}" alt=""></div>`;
  el.innerHTML = `${av}
    <div class="meta">
      <div class="nm">${esc(c.title)}${c.kind==="dm"?'<span class="badge">单聊</span>':''}</div>
      <div class="sub">${esc(c.last || (c.turns? c.turns+" 条":"空对话"))}</div>
    </div>
    <div class="acts2">
      <button title="改名">✎</button>
      <button title="删除">✕</button>
    </div>`;
  el.onclick = e => {
    const bs = el.querySelectorAll(".acts2 button");
    if(e.target === bs[0]){ renameConv(c); return; }
    if(e.target === bs[1]){ deleteConv(c); return; }
    openConv(c.id);
  };
  return el;
}

function renderContacts(box){
  if(!S.contacts.length){
    box.innerHTML = '<div class="railempty">通讯录是空的<br>点下面添加</div>';
    return;
  }
  const order = [...S.cats, "其他"];
  const grouped = groupBy(S.contacts, c=>c.category);
  const keys = [...grouped.keys()].sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });

  for(const cat of keys){
    const rows = grouped.get(cat);
    const closed = S.closed.has("p:"+cat);
    const g = document.createElement("div");
    g.className = "grp";
    g.innerHTML = `<div class="grph${closed?" closed":""}">
        <span class="cv">▾</span>${esc(cat)}<span class="n">${rows.length}</span></div>`;
    g.querySelector(".grph").onclick = () => {
      const k = "p:"+cat;
      S.closed.has(k) ? S.closed.delete(k) : S.closed.add(k);
      renderList();
    };
    if(!closed) for(const c of rows) g.appendChild(contactItem(c));
    box.appendChild(g);
  }
  const add = document.createElement("div");
  add.className = "grp";
  add.innerHTML = '<button class="btn ghost" style="width:100%;font-size:12px;padding:8px 0;margin-top:8px">＋ 添加模型</button>';
  add.querySelector("button").onclick = openContactModal;
  box.appendChild(add);
}

function contactItem(c){
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="av"><img src="${avUrl(c.id)}" alt=""></div>
    <div class="meta">
      <div class="nm">${esc(c.name)}</div>
      <div class="sub">${esc(c.model || c.provider)}</div>
    </div>
    <div class="acts2">
      <button title="换头像">▣</button>
      <button title="删除">✕</button>
    </div>`;
  const bs = el.querySelectorAll(".acts2 button");
  bs[0].onclick = e => { e.stopPropagation(); pickAvatar(c); };
  bs[1].onclick = async e => {
    e.stopPropagation();
    if(!confirm("从通讯录移除 " + c.name + "？已有的对话记录不受影响。")) return;
    await del("/api/contacts/" + c.id);
    await refresh();
  };
  el.onclick = () => startDM(c);
  return el;
}

/* ───────── 打开会话 ───────── */
async function openConv(id, keepScroll){
  S.hits = null;
  S.cur = id;
  S.conv = await api("/api/conversations/" + id);
  $("ttl").textContent = S.conv.title;
  $("ttl").className = "ttl";
  renderList();
  renderMemAv();
  renderChips();
  renderLog(S.conv.turns);
  paint(S.conv);
  $("input").focus();
}

function renderMemAv(){
  const box = $("memAv");
  const mems = (S.conv && S.conv.members) || [];
  box.innerHTML = mems.slice(0,5).map(id=>`<img src="${avUrl(id)}" title="${esc(cname(id))}">`).join("");
}

function renderChips(){
  const box = $("chips");
  box.innerHTML = "";
  if(!S.conv) return;
  for(const id of S.conv.members || []){
    const c = document.createElement("span");
    c.className = "chip";
    c.innerHTML = `<img src="${avUrl(id)}">@${esc(cname(id))}`;
    c.onclick = () => {
      const t = $("input");
      t.value = (t.value.replace(/\s+$/,"") + " @" + cname(id) + " ").trimStart();
      t.focus();
    };
    box.appendChild(c);
  }
}

function renderLog(turns){
  const log = $("log");
  log.innerHTML = "";
  if(!turns || !turns.length){ renderEmpty(); return; }
  for(const t of turns) log.appendChild(msgRow(t));
  log.scrollTop = log.scrollHeight;
}

function msgRow(t){
  const mine = t.role === "user";
  const el = document.createElement("div");
  el.className = "row" + (mine ? " me" : "") + (t.error ? " err" : "");

  const av = document.createElement("div");
  av.className = "av";
  const key = mine ? "generic" : (t.speaker_id || t.speaker);
  av.innerHTML = mine ? "你" : `<img src="${avUrl(key)}" alt="">`;

  const body = document.createElement("div");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = mine ? "你" : (t.speaker || "");
  if(!mine && t.tokens) {
    const tk = document.createElement("span");
    tk.className = "tk"; tk.textContent = t.tokens + " tok";
    who.appendChild(tk);
  }
  const bub = document.createElement("div");
  bub.className = "bub";
  bub.innerHTML = esc(t.error || t.content || "").replace(/@([A-Za-z0-9_\u4e00-\u9fa5-]+)/g,
    '<span class="mention">@$1</span>');
  body.appendChild(who); body.appendChild(bub);
  el.appendChild(av); el.appendChild(body);
  return el;
}

function appendRow(t){
  const log = $("log");
  const e = log.querySelector(".bigempty"); if(e) e.remove();
  log.appendChild(msgRow(t));
  log.scrollTop = log.scrollHeight;
}

function renderEmpty(){
  const log = $("log");
  log.innerHTML = "";
  const box = document.createElement("div");
  box.className = "bigempty";
  if(!S.convs.length){
    box.innerHTML = `<div class="h">还没有对话</div>
      <div>左边「＋ 新对话」选一个模型开始单聊<br>选多个就是群聊</div>`;
    const cards = document.createElement("div");
    cards.className = "cards";
    for(const c of S.contacts.slice(0,4)){
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML = `<img src="${avUrl(c.id)}" style="width:34px;height:34px;border-radius:10px;margin-bottom:7px">
        <b>${esc(c.name)}</b><small>${esc((c.model||"").split("/").pop()||c.provider)}</small>`;
      d.onclick = () => startDM(c);
      cards.appendChild(d);
    }
    box.appendChild(cards);
  } else {
    box.innerHTML = `<div class="h">这个对话还是空的</div>
      <div>不 <kbd>@</kbd> 任何人 = 全员回答<br><kbd>@名字</kbd> = 只说给某个人听</div>`;
  }
  log.appendChild(box);
}

/* ───────── 统计面板 ───────── */
function paint(d){
  $("sTok").textContent = fmt(d.tokens);
  $("sCost").textContent = money(d.cost) + (d.cost_unknown ? "+" : "");
  $("costTop").textContent = d.tokens ? `${fmt(d.tokens)} tok · ${money(d.cost)}` : "";
  paintCompression(d.compression);
  paintMembers(d);
}

function paintCompression(c){
  const bar = $("cBar"), lbl = $("cLbl"), num = $("cNum"), hint = $("cHint");
  if(!c || (!c.compressed && !c.raw_tokens)){
    bar.style.width="0%"; lbl.textContent="还没开始"; num.textContent=""; hint.textContent=""; return;
  }
  if(c.skipped){
    bar.style.width="4%"; lbl.textContent="无需压缩"; num.textContent="";
    hint.textContent="发言还短，压缩反而更大，已自动跳过。"; return;
  }
  if(!c.compressed){
    bar.style.width="6%"; lbl.textContent="未触发"; num.textContent="";
    hint.textContent="还没到保留条数，全部逐字发送。"; return;
  }
  const raw = c.raw_tokens||1, dig = c.digest_tokens||0;
  const saved = Math.max(0, 1 - dig/raw);
  bar.style.width = Math.min(100, Math.max(8,(1-saved)*100)) + "%";
  lbl.textContent = `较早的 ${c.older_turns} 条已压缩`;
  num.textContent = `${fmt(dig)} / ${fmt(raw)}`;
  hint.innerHTML = `省下 <b style="color:var(--ok)">${(saved*100).toFixed(0)}%</b> 的早期上下文`
    + (c.dropped ? `<br><span style="color:var(--warn)">超预算，另省略 ${c.dropped} 条</span>` : "");
}

function paintMembers(d){
  const box = $("memList");
  const mems = (S.conv && S.conv.members) || [];
  if(!mems.length){ box.innerHTML = '<div class="hint">—</div>'; return; }
  const per = {};
  for(const t of (S.conv && S.conv.turns) || []){
    if(t.role !== "assistant") continue;
    const k = t.speaker_id || t.speaker;
    per[k] = per[k] || {tok:0, cost:0};
    per[k].tok += Number(t.tokens||0);
    per[k].cost += Number(t.cost||0);
  }
  box.innerHTML = mems.map(id=>{
    const p = per[id] || {tok:0,cost:0};
    return `<div class="memb"><img src="${avUrl(id)}"><span>${esc(cname(id))}</span>
      <span class="c">${fmt(p.tok)}</span></div>`;
  }).join("");
}

/* ───────── 发言 ───────── */
async function say(){
  const t = $("input").value.trim();
  if(!t || S.running || !S.cur) return;
  $("input").value = "";
  appendRow({role:"user", content:t, speaker:"你"});
  setRunning(true);

  const pending = document.createElement("div");
  pending.className = "note";
  pending.innerHTML = '<div class="txt">等待回应…</div>';
  $("log").appendChild(pending);
  $("log").scrollTop = $("log").scrollHeight;

  try{
    const r = await fetch(`/api/conversations/${S.cur}/say`, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:t})
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      throw new Error(e.error || ("HTTP "+r.status));
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "", first = true;

    while(true){
      const {value, done} = await rd.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let k;
      while((k = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0,k); buf = buf.slice(k+2);
        if(!chunk.startsWith("data: ")) continue;
        let ev; try{ ev = JSON.parse(chunk.slice(6)); }catch{ continue; }

        if(ev.type === "turn" || ev.type === "error"){
          if(first){ pending.remove(); first = false; }
          appendRow({role:"assistant", speaker:ev.speaker, content:ev.content,
                     error: ev.type==="error" ? ev.message : null,
                     tokens:ev.tokens, speaker_id: (S.conv&&S.conv.names||{})[ev.speaker]});
        } else if(ev.type === "done"){
          if(first){ pending.remove(); first = false; }
          if(ev.conversation){ S.conv = Object.assign({}, S.conv, ev.conversation); }
          paint({tokens:ev.tokens, cost:ev.cost, cost_unknown:ev.cost_unknown,
                 compression:ev.compression});
          if(ev.stop){
            const n = document.createElement("div");
            n.className = "note";
            n.innerHTML = '<div class="txt">— ' + esc(ev.stop) + "</div>";
            $("log").appendChild(n);
            $("log").scrollTop = $("log").scrollHeight;
          }
        }
      }
    }
  }catch(e){
    pending.remove();
    appendRow({role:"assistant", speaker:"system", content:"请求失败："+e.message, error:e.message});
  }finally{
    setRunning(false);
    $("input").focus();
    refresh();
  }
}

function setRunning(on){
  S.running = on;
  $("btnSend").style.display = on ? "none" : "";
  $("btnStop").style.display = on ? "" : "none";
  $("btnSend").disabled = on;
}

async function stopRun(){
  if(!S.cur) return;
  $("btnStop").disabled = true;
  await api(`/api/conversations/${S.cur}/stop`, {method:"POST"});
  $("btnStop").disabled = false;
}

/* ───────── 会话操作 ───────── */
async function startDM(contact){
  const exist = S.convs.find(c=>c.kind==="dm" && (c.members||[]).length===1 && c.members[0]===contact.id);
  if(exist){ S.tab="chats"; syncTabs(); await openConv(exist.id); return; }
  const c = await post("/api/conversations", {members:[contact.id], title:contact.name, category:contact.category});
  S.tab = "chats"; syncTabs();
  await refresh();
  await openConv(c.id);
}

async function renameConv(c){
  const t = prompt("改个名字", c.title);
  if(t == null) return;
  const title = t.trim();
  if(!title || title === c.title) return;
  await patch("/api/conversations/" + c.id, {title});
  if(S.cur === c.id) $("ttl").textContent = title;
  await refresh();
}

async function deleteConv(c){
  if(!confirm(`删除「${c.title}」？聊天记录会一起没掉。`)) return;
  await del("/api/conversations/" + c.id);
  if(S.cur === c.id) S.cur = null;
  await refresh();
}

async function renameInline(){
  if(!S.conv) return;
  const el = $("ttl");
  const old = S.conv.title;
  const input = document.createElement("input");
  input.className = "rename"; input.value = old;
  el.replaceWith(input);
  input.focus(); input.select();
  const finish = async ok => {
    const v = input.value.trim();
    const t = document.createElement("div");
    t.id = "ttl"; t.className = "ttl"; t.onclick = renameInline;
    if(ok && v && v !== old){
      try{ await patch("/api/conversations/" + S.conv.id, {title:v}); S.conv.title = v; }catch(e){}
      t.textContent = v;
    } else t.textContent = old;
    input.replaceWith(t);
    if(ok && v && v !== old) refresh();
  };
  input.onblur = () => finish(true);
  input.onkeydown = e => {
    if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
    if(e.key === "Escape"){ input.onblur = null; finish(false); }
  };
}

/* ───────── 头像 ───────── */
function pickAvatar(contact){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    if(f.size > 900*1024){ alert("图片太大，选 900KB 以内的"); return; }
    const rd = new FileReader();
    rd.onload = async () => {
      try{
        await post("/api/avatar/" + contact.id, {data: rd.result});
        await refresh();
        if(S.cur) await openConv(S.cur, true);
      }catch(e){ alert("上传失败：" + e.message); }
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

/* ───────── 搜索 ───────── */
let qTimer = null;
function onSearch(){
  clearTimeout(qTimer);
  const q = $("q").value.trim();
  S.q = q;
  if(!q){ S.hits = null; if(S.conv) renderLog(S.conv.turns); else renderEmpty(); return; }
  qTimer = setTimeout(doSearch, 220);
}

async function doSearch(){
  try{
    const d = await api("/api/search?q=" + encodeURIComponent(S.q));
    S.hits = d.hits || [];
    renderHits();
  }catch(e){ S.hits = []; renderHits(); }
}

function renderHits(){
  const log = $("log");
  log.innerHTML = "";
  const head = document.createElement("div");
  head.className = "hithead";
  head.textContent = S.q ? `「${S.q}」找到 ${S.hits.length} 处` : "";
  log.appendChild(head);

  if(!S.hits.length){
    const e = document.createElement("div");
    e.className = "bigempty";
    e.innerHTML = '<div class="h">没有找到</div><div>换个词试试</div>';
    log.appendChild(e);
    return;
  }
  const q = S.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  for(const h of S.hits){
    const el = document.createElement("div");
    el.className = "hit";
    el.innerHTML = `<div class="t">${esc(h.title)}<span class="w">${esc(h.where)}</span></div>
      <div class="s">${esc(h.snippet).replace(new RegExp("("+q+")","gi"),"<mark>$1</mark>")}</div>`;
    el.onclick = () => { $("q").value = ""; S.q=""; S.hits=null; openConv(h.conversation); };
    log.appendChild(el);
  }
}

/* ───────── 弹层 ───────── */
function openModal(id){ $(id).classList.add("open"); }
function closeModal(id){ $(id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(b=>{
  b.onclick = () => closeModal(b.dataset.close);
});
document.querySelectorAll(".modal").forEach(m=>{
  m.onclick = e => { if(e.target === m) m.classList.remove("open"); };
});

let pickSel = new Set();
function openNewModal(){
  pickSel = new Set();
  $("nTitle").value = "";
  $("nCat").value = "常用";
  $("nErr").textContent = "";
  const box = $("nPick");
  box.innerHTML = "";
  for(const c of S.contacts){
    const el = document.createElement("div");
    el.className = "p";
    el.innerHTML = `<img src="${avUrl(c.id)}"><div><div class="nm">${esc(c.name)}</div>
      <div class="sub">${esc((c.model||"").split("/").pop()||c.provider)}</div></div>`;
    el.onclick = () => {
      if(pickSel.has(c.id)){ pickSel.delete(c.id); el.classList.remove("on"); }
      else { pickSel.add(c.id); el.classList.add("on"); }
    };
    box.appendChild(el);
  }
  openModal("mNew");
}

function openContactModal(){
  $("cName").value = ""; $("cModel").value = ""; $("cCat").value = "常用";
  $("cErr").textContent = "";
  openModal("mContact");
}

function openSettings(){
  const c = (S.info && S.info.context) || {};
  const b = (S.info && S.info.budget) || {};
  $("setCompress").checked = c.enabled !== false;
  $("setKeep").value = c.keep_recent || 8;
  $("setBudget").value = c.budget_tokens || 6000;
  $("setRounds").value = b.max_rounds || 6;
  $("setCost").value = b.max_cost_usd ?? 0.5;
  $("setErr").textContent = "";
  openModal("mSet");
}

function showOnboarding(){
  const found = (S.info.detected && S.info.detected.providers) || [];
  // 每次打开都从「隐藏」开始，不继承上一次的状态
  $("onbKey").value = "";
  hideKey();
  const box = $("onbFound");
  box.innerHTML = "";
  for(const p of found){
    const d = document.createElement("div");
    d.className = "p on";
    d.style.cssText = "display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent-soft);margin-bottom:8px;cursor:pointer";
    d.innerHTML = `<span style="color:var(--ok)">✓</span>
      <div style="flex:1;font-size:13px">检测到 <b>${esc(p.name)}</b> 的 key
        <div style="color:var(--dim);font-size:11px">${esc(p.masked)} · ${esc(p.source||"本机")}</div></div>
      <button class="btn" style="font-size:12px;padding:5px 11px">就用这个</button>`;
    d.querySelector("button").onclick = () => submitOnb({preset:"省钱"});
    box.appendChild(d);
  }
  openModal("mOnb");
}

async function submitOnb(extra){
  $("onbErr").textContent = "";

  // 读一次就清空：不让 key 停在 DOM 里，也不让它进入任何前端状态
  const raw = $("onbKey").value.trim();
  $("onbKey").value = "";
  hideKey();

  const body = Object.assign({
    provider: $("onbProv").value,
    api_key: raw
  }, extra || {});

  try{
    const d = await post("/api/setup", body);
    closeModal("mOnb");
    await refresh(d.info);
  }catch(e){
    $("onbErr").textContent = e.message;
  }
}

/* 密钥显隐：默认藏，点了才临时露出，失焦/提交后自动收回 */
function showKey(){
  const i = $("onbKey");
  if(!i) return;
  i.type = "text";
  $("onbEye").classList.add("on");
}
function hideKey(){
  const i = $("onbKey");
  if(!i) return;
  i.type = "password";
  $("onbEye").classList.remove("on");
}
function toggleKey(){
  if($("onbKey").type === "password") showKey(); else hideKey();
}

/* ───────── 事件 ───────── */
function syncTabs(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab === S.tab));
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = () => { S.tab = t.dataset.tab; syncTabs(); renderList(); };
});
$("btnNew").onclick = openNewModal;
$("btnSet").onclick = openSettings;
$("btnTheme").onclick = () => setTheme(S.theme === "dark" ? "light" : "dark");
$("btnInsp").onclick = () => $("insp").classList.toggle("open");
$("btnExport").onclick = () => { if(S.cur) window.open(`/api/conversations/${S.cur}/export`,"_blank"); };
$("btnSend").onclick = say;
$("btnStop").onclick = stopRun;
$("ttl").onclick = renameInline;
$("q").oninput = onSearch;

$("nGo").onclick = async () => {
  $("nErr").textContent = "";
  if(!pickSel.size){ $("nErr").textContent = "至少选一个模型"; return; }
  try{
    const c = await post("/api/conversations", {
      members:[...pickSel],
      title:$("nTitle").value.trim(),
      category:$("nCat").value.trim() || "常用"
    });
    closeModal("mNew");
    S.tab = "chats"; syncTabs();
    await refresh();
    await openConv(c.id);
  }catch(e){ $("nErr").textContent = e.message; }
};

$("cGo").onclick = async () => {
  $("cErr").textContent = "";
  if(!$("cName").value.trim()){ $("cErr").textContent = "名字不能为空"; return; }
  try{
    await post("/api/contacts", {
      name:$("cName").value.trim(),
      provider:$("cProv").value,
      model:$("cModel").value.trim(),
      category:$("cCat").value.trim() || "常用",
      role:$("cRole").value
    });
    closeModal("mContact");
    await refresh();
  }catch(e){ $("cErr").textContent = e.message; }
};

$("setGo").onclick = async () => {
  $("setErr").textContent = "";
  try{
    const d = await post("/api/settings", {
      theme: S.theme,
      context:{
        enabled:$("setCompress").checked,
        keep_recent: parseInt($("setKeep").value)||8,
        budget_tokens: parseInt($("setBudget").value)||6000
      },
      budget:{
        max_rounds: parseInt($("setRounds").value)||6,
        max_cost_usd: parseFloat($("setCost").value)||null
      }
    });
    closeModal("mSet");
    await refresh(d.info);
  }catch(e){ $("setErr").textContent = e.message; }
};

$("thDark").onclick = () => setTheme("dark");
$("thLight").onclick = () => setTheme("light");
$("onbEye").onclick = toggleKey;
// 阻止眼睛按钮抢走输入框焦点，否则「blur 收回」会和「点击显示」打架
$("onbEye").addEventListener("mousedown", e => e.preventDefault());
// 失焦自动收回：用户点了眼睛看一眼，切走时不该一直明文留在屏幕上
$("onbKey").addEventListener("blur", hideKey);
$("onbGo").onclick = () => {
  if(!$("onbKey").value.trim()){
    const found = (S.info && S.info.detected && S.info.detected.providers) || [];
    if(found.length) return submitOnb({preset:"省钱"});
    $("onbErr").textContent = "先粘贴一个 key，或点上面「就用这个」";
    return;
  }
  submitOnb();
};

$("input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); say(); }
});
document.addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && e.key === "k"){ e.preventDefault(); $("q").focus(); $("q").select(); }
  if(e.key === "Escape"){
    document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"));
    if(S.q){ $("q").value=""; S.q=""; S.hits=null; if(S.conv) renderLog(S.conv.turns); }
  }
});

(async () => {
  try{ await refresh(); }
  catch(e){
    $("log").innerHTML = '<div class="bigempty"><div class="h">加载失败</div><div>'
      + esc(e.message) + "</div></div>";
  }
  $("input").focus();
})();
</script>
</body>
</html>
