[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polylogue"
version = "0.3.4"
description = "让多个 AI 在一个房间里会商：能同时问、也能互相点名接话，带成本硬顶和收敛检测"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xingaorpw" }]
keywords = [
  "multi-agent", "llm", "gpt", "claude", "gemini", "grok", "deepseek",
  "group-chat", "orchestration", "ai-collaboration", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
polylogue = "polylogue.cli:main"

[project.urls]
Homepage = "https://github.com/xingaorpw/polylogue"
Issues = "https://github.com/xingaorpw/polylogue/issues"

[tool.setuptools]
packages = ["polylogue"]

[tool.setuptools.package-data]
polylogue = ["static/*.html"]
