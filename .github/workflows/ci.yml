name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已升到 26.04，没有 3.9 的构建，钉在 22.04
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 单元测试 + 端到端测试
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: python -m pip install -e .

      - name: 列出 provider
        run: polylogue --list-providers

      - name: 缺 key 时必须报错并说清要哪个变量
        run: |
          set +e
          out=$(polylogue "hi" --models openai 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::缺 key 时不该退出 0"
            exit 1
          fi
          if ! echo "$out" | grep -q "OPENAI_API_KEY"; then
            echo "::error::错误信息里应该说明要哪个环境变量"
            exit 1
          fi
          echo "缺 key 时报错正确"

      - name: Web 界面必须真的起得来
        run: |
          polylogue --web --models ollama --port 8791 &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8791/ > /tmp/index.html; then
              break
            fi
            sleep 0.5
          done

          test -s /tmp/index.html || { echo "::error::首页没取到"; kill $server_pid; exit 1; }
          grep -q "polylogue" /tmp/index.html || { echo "::error::首页内容不对"; kill $server_pid; exit 1; }
          grep -q "api/rooms" /tmp/index.html || { echo "::error::工作台没接上房间接口"; kill $server_pid; exit 1; }
          if grep -qE "cdn\.|unpkg|jsdelivr|googleapis" /tmp/index.html; then
            echo "::error::页面不该引外部资源，否则离线打不开"
            kill $server_pid
            exit 1
          fi

          # 接口也要通
          curl -sf http://127.0.0.1:8791/api/info > /tmp/info.json || { echo "::error::/api/info 不通"; kill $server_pid; exit 1; }
          curl -sf http://127.0.0.1:8791/api/rooms > /tmp/rooms.json || { echo "::error::/api/rooms 不通"; kill $server_pid; exit 1; }
          python - <<'PY'
          import json
          info = json.load(open('/tmp/info.json'))
          rooms = json.load(open('/tmp/rooms.json'))
          names = {p['name'] for p in info['providers']}
          for expected in ('openai', 'claude', 'gemini', 'grok', 'deepseek', 'groq'):
              assert expected in names, f'缺少 {expected}'
          assert rooms['rooms'], '默认房间没建出来'
          print('接口正常，provider 齐全，默认房间存在')
          PY

          kill $server_pid 2>/dev/null || true
          echo "工作台正常，且不依赖外部资源"
